# Real language-server diagnostics and refactors. The editor protocol remains
# disabled because the Web/Desktop profile owns stdio; agent tools use these
# local servers directly.
- id: lsp-actions
  config:
    servers:
      typescript:
        command: typescript-language-server
        args: [--stdio]
        extensionToLanguage:
          .ts: typescript
          .tsx: typescriptreact
          .js: javascript
          .jsx: javascriptreact
          .mjs: javascript
          .cjs: javascript
      python:
        command: pyright-langserver
        args: [--stdio]
        extensionToLanguage:
          .py: python
          .pyi: python
      json:
        command: vscode-json-language-server
        args: [--stdio]
        extensionToLanguage:
          .json: json
          .jsonc: jsonc
      html:
        command: vscode-html-language-server
        args: [--stdio]
        extensionToLanguage:
          .html: html
          .htm: html
      css:
        command: vscode-css-language-server
        args: [--stdio]
        extensionToLanguage:
          .css: css
          .scss: scss
          .less: less
      yaml:
        command: yaml-language-server
        args: [--stdio]
        extensionToLanguage:
          .yaml: yaml
          .yml: yaml
      shell:
        command: bash-language-server
        args: [start]
        extensionToLanguage:
          .sh: shellscript
          .bash: shellscript
          .zsh: shellscript
    editor:
      enabled: false
      requestTimeoutMs: 60000
      diagnosticsCacheMaxFiles: 64
    maxDiagnostics: 200
    maxCompletionItems: 20
    maxCodeActions: 50
    maxSymbols: 100
    maxSignatures: 10
    maxInlayHints: 200
    maxResultChars: 16000
    maxDocumentBytes: 4000000
    timeoutMs: 60000
