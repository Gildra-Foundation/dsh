name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: chmod +x scripts/verify.sh desktop/macos/build.sh install/*.command install/dsh-gildra install/*.sh install/dsh-gildra-server 'Install Gildra DSH.command'
      - run: ./scripts/verify.sh

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: chmod +x install/*.sh install/dsh-gildra-server scripts/*.mjs
      - run: bash -n install/linux-server-install.sh install/dsh-gildra-server install/Start-GildraDSH.server.sh
      - run: node scripts/kit-config.test.mjs

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem install -Filter *.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
