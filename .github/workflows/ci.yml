name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:dom
      - name: ShellCheck (errors only)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck --severity=error install/linux-server-install.sh install/dsh-gildra-server install/Start-GildraDSH.server.sh

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - run: chmod +x scripts/verify.sh desktop/macos/build.sh install/*.command install/dsh-gildra install/*.sh install/dsh-gildra-server 'Install Gildra DSH.command'
      - run: ./scripts/verify.sh

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - run: chmod +x install/*.sh install/dsh-gildra-server scripts/*.mjs
      - run: bash -n install/linux-server-install.sh install/dsh-gildra-server install/Start-GildraDSH.server.sh
      - name: Run JS tests
        run: |
          node scripts/kit-config.test.mjs
          node scripts/gildra-update.test.mjs
          node scripts/sync-server-fleet.test.mjs
          node plugins/gildra-dsh-ui-compact/test.mjs
          node plugins/gildra-skill-installer/test.mjs
          node patches/workspace-files-explorer-index.test.mjs
          node plugins/gildra-dsh-runtime/test/unit.test.mjs
          node plugins/gildra-dsh-runtime/test/git-safety.test.mjs
          node plugins/gildra-dsh-runtime/test/store.test.mjs
          node plugins/gildra-dsh-runtime/test/crash-recovery.test.mjs
          node plugins/gildra-dsh-runtime/test/merge.test.mjs
          node plugins/gildra-dsh-runtime/test/runtime-resources.test.mjs
          node plugins/gildra-dsh-runtime/test/projects.test.mjs
          node plugins/gildra-dsh-runtime/test/repo-intel.test.mjs
          node plugins/gildra-dsh-runtime/test/tasks.test.mjs
          node plugins/gildra-dsh-runtime/test/quality.test.mjs
          node plugins/gildra-dsh-runtime/test/review.test.mjs
          node plugins/gildra-dsh-runtime/test/upstream.test.mjs
          node plugins/gildra-dsh-runtime/test/context.test.mjs
          node plugins/gildra-dsh-runtime/test/fetch-race.test.mjs
          node plugins/gildra-dsh-runtime/test/e2e-team-flow.test.mjs
          node plugins/gildra-dsh-runtime/test/architecture.test.mjs
          node plugins/gildra-dsh-runtime/test/modularity.test.mjs
          node plugins/gildra-dsh-runtime/test/new-large-module.test.mjs
          node plugins/gildra-dsh-runtime/test/responsibility-expansion.test.mjs
          node plugins/gildra-dsh-runtime/test/public-api-gate.test.mjs
          node plugins/gildra-dsh-runtime/test/capabilities.test.mjs
          node plugins/gildra-dsh-runtime/test/verification-races.test.mjs
          node plugins/gildra-dsh-runtime/test/team.test.mjs
          node plugins/gildra-dsh-runtime/test/team-consistency.test.mjs
          node plugins/gildra-dsh-runtime/test/team-e2e.test.mjs
          node plugins/gildra-dsh-runtime/test/modularity-e2e.test.mjs
          node plugins/gildra-dsh-runtime/test/multiprocess.test.mjs
          node plugins/gildra-dsh-runtime/test/stress.test.mjs
          node plugins/gildra-dsh-runtime/test/workspaces.test.mjs
          node plugins/gildra-dsh-runtime/test/leases.test.mjs
          node plugins/gildra-dsh-runtime/test/sessions.test.mjs
          node plugins/gildra-dsh-runtime/test/api.test.mjs
      - name: Server installer smoke (fresh + idempotent + preservation)
        env:
          GILDRA_DSH_INSTALL_ROOT: ${{ runner.temp }}/gildra-dsh
          # Ollama — внешний рантайм с собственным SHA-контуром; его загрузка
          # (~1 ГБ) сделала бы каждый push неоправданно тяжёлым. Хук
          # GILDRA_DSH_SKIP_OLLAMA задокументирован в самом установщике.
          GILDRA_DSH_SKIP_OLLAMA: '1'
        run: |
          ./install/linux-server-install.sh
          test -f "$GILDRA_DSH_INSTALL_ROOT/.gildra-kit-version"
          test -x "$GILDRA_DSH_INSTALL_ROOT/bin/dsh-gildra"
          test -x "$GILDRA_DSH_INSTALL_ROOT/bin/Start-GildraDSH.server.sh"
          grep -F 'CONFIGURED_PORT=3080' "$GILDRA_DSH_INSTALL_ROOT/config/server.env"
          mkdir -p "$GILDRA_DSH_INSTALL_ROOT/home/.agent-presets/custom-preserved"
          printf 'user-setting-preserved\n' > "$GILDRA_DSH_INSTALL_ROOT/home/user-preservation-check.txt"
          printf 'name: Custom preserved\n' > "$GILDRA_DSH_INSTALL_ROOT/home/.agent-presets/custom-preserved/preset.yml"
          settings_hash="$(sha256sum "$GILDRA_DSH_INSTALL_ROOT/home/settings.yaml" | awk '{print $1}')"
          ./install/linux-server-install.sh
          test "$settings_hash" = "$(sha256sum "$GILDRA_DSH_INSTALL_ROOT/home/settings.yaml" | awk '{print $1}')"
          grep -F 'user-setting-preserved' "$GILDRA_DSH_INSTALL_ROOT/home/user-preservation-check.txt"
          grep -F 'Custom preserved' "$GILDRA_DSH_INSTALL_ROOT/home/.agent-presets/custom-preserved/preset.yml"
          "$GILDRA_DSH_INSTALL_ROOT/bin/dsh-gildra" --profile web --dump-config >/dev/null
      - name: Installer failure paths
        run: |
          if GILDRA_DSH_INSTALL_ROOT="$HOME/" ./install/linux-server-install.sh; then
            echo 'unsafe trailing-slash root was accepted'; exit 1
          fi
          fail_root="$RUNNER_TEMP/gildra-fail"
          if GILDRA_DSH_INSTALL_ROOT="$fail_root" GILDRA_DSH_PORT=99 ./install/linux-server-install.sh; then
            echo 'invalid port was accepted'; exit 1
          fi
          test ! -f "$fail_root/.gildra-kit-version"

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          # ParseFile assigns the [ref] variable per call, so errors must be
          # accumulated manually or only the last file's result survives.
          $allErrors = @()
          Get-ChildItem install -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count) {
              Write-Host "Parse errors in $($_.Name):"
              $errors | Format-List
              $allErrors += $errors
            }
          }
          if ($allErrors.Count) { exit 1 }
      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path install -Recurse -Severity Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }
      - name: Run JS tests
        # bash: у pwsh-шагов GitHub наружу уходит только код последней
        # команды, и упавший промежуточный тест не валил бы шаг.
        shell: bash
        run: |
          node scripts/kit-config.test.mjs
          node scripts/gildra-update.test.mjs
          node scripts/sync-server-fleet.test.mjs
          node plugins/gildra-dsh-ui-compact/test.mjs
          node plugins/gildra-skill-installer/test.mjs
          node patches/workspace-files-explorer-index.test.mjs
          node plugins/gildra-dsh-runtime/test/unit.test.mjs
          node plugins/gildra-dsh-runtime/test/git-safety.test.mjs
          node plugins/gildra-dsh-runtime/test/store.test.mjs
          node plugins/gildra-dsh-runtime/test/crash-recovery.test.mjs
          node plugins/gildra-dsh-runtime/test/merge.test.mjs
          node plugins/gildra-dsh-runtime/test/runtime-resources.test.mjs
          node plugins/gildra-dsh-runtime/test/projects.test.mjs
          node plugins/gildra-dsh-runtime/test/repo-intel.test.mjs
          node plugins/gildra-dsh-runtime/test/tasks.test.mjs
          node plugins/gildra-dsh-runtime/test/quality.test.mjs
          node plugins/gildra-dsh-runtime/test/review.test.mjs
          node plugins/gildra-dsh-runtime/test/upstream.test.mjs
          node plugins/gildra-dsh-runtime/test/context.test.mjs
          node plugins/gildra-dsh-runtime/test/fetch-race.test.mjs
          node plugins/gildra-dsh-runtime/test/e2e-team-flow.test.mjs
          node plugins/gildra-dsh-runtime/test/architecture.test.mjs
          node plugins/gildra-dsh-runtime/test/modularity.test.mjs
          node plugins/gildra-dsh-runtime/test/new-large-module.test.mjs
          node plugins/gildra-dsh-runtime/test/responsibility-expansion.test.mjs
          node plugins/gildra-dsh-runtime/test/public-api-gate.test.mjs
          node plugins/gildra-dsh-runtime/test/capabilities.test.mjs
          node plugins/gildra-dsh-runtime/test/verification-races.test.mjs
          node plugins/gildra-dsh-runtime/test/team.test.mjs
          node plugins/gildra-dsh-runtime/test/team-consistency.test.mjs
          node plugins/gildra-dsh-runtime/test/team-e2e.test.mjs
          node plugins/gildra-dsh-runtime/test/modularity-e2e.test.mjs
          node plugins/gildra-dsh-runtime/test/multiprocess.test.mjs
          node plugins/gildra-dsh-runtime/test/stress.test.mjs
          node plugins/gildra-dsh-runtime/test/workspaces.test.mjs
          node plugins/gildra-dsh-runtime/test/leases.test.mjs
          node plugins/gildra-dsh-runtime/test/sessions.test.mjs
          node plugins/gildra-dsh-runtime/test/api.test.mjs
      - name: Installer failure path must not leave a "healthy" install
        shell: pwsh
        run: |
          # Производственная семантика: установщик исполняется Windows
          # PowerShell 5.1 (powershell.exe), как в windows-install.cmd.
          $env:GILDRA_DSH_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'gildra-failure'
          $env:GILDRA_DSH_NO_LAUNCH = '1'
          $env:GILDRA_DSH_TEST_FAIL_MATCH = 'corepack prepare pnpm'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install\windows-install.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Installer must fail when a native command fails' }
          if (Test-Path (Join-Path $env:GILDRA_DSH_INSTALL_ROOT '.gildra-kit-version')) { throw 'Kit marker must not exist after a failed install' }
          if (Test-Path (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'source')) { throw 'Broken stage must not become the active source' }
          Remove-Item Env:GILDRA_DSH_TEST_FAIL_MATCH
          $env:GILDRA_DSH_INSTALL_ROOT = "$env:USERPROFILE\"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install\windows-install.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Unsafe install root must be rejected' }
          exit 0
