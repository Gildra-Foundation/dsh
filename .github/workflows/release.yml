name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build app
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then node -e 'const m=require("./config/kit.json"); if (process.env.GITHUB_REF_NAME !== `v${m.distribution.version}`) throw new Error("Release tag and kit version differ")'; fi
          chmod +x desktop/macos/build.sh install/*.command install/dsh-gildra install/*.sh install/dsh-gildra-server 'Install Gildra DSH.command' 'Update Gildra DSH.command'
          chmod +x scripts/*.sh scripts/*.mjs
          ./scripts/verify.sh
      - name: Clean install smoke test
        run: |
          export GILDRA_DSH_INSTALL_ROOT="$RUNNER_TEMP/gildra-dsh"
          export GILDRA_DSH_NO_LAUNCH=1
          ./install/macos-install.command
          mkdir -p "$GILDRA_DSH_INSTALL_ROOT/home/.agent-presets/custom-preserved"
          printf 'user-setting-preserved\n' > "$GILDRA_DSH_INSTALL_ROOT/home/user-preservation-check.txt"
          printf 'name: Custom preserved\n' > "$GILDRA_DSH_INSTALL_ROOT/home/.agent-presets/custom-preserved/preset.yml"
          settings_hash="$(shasum -a 256 "$GILDRA_DSH_INSTALL_ROOT/home/settings.yaml" | awk '{print $1}')"
          ./install/macos-install.command
          test "$settings_hash" = "$(shasum -a 256 "$GILDRA_DSH_INSTALL_ROOT/home/settings.yaml" | awk '{print $1}')"
          grep -F 'user-setting-preserved' "$GILDRA_DSH_INSTALL_ROOT/home/user-preservation-check.txt"
          grep -F 'Custom preserved' "$GILDRA_DSH_INSTALL_ROOT/home/.agent-presets/custom-preserved/preset.yml"
          test -x "$GILDRA_DSH_INSTALL_ROOT/bin/Update-GildraDSH.command"
          test -f "$GILDRA_DSH_INSTALL_ROOT/.gildra-kit-version"
          "$GILDRA_DSH_INSTALL_ROOT/bin/dsh-gildra" --profile web --dump-config >/dev/null
      - name: Assemble archive
        run: |
          mkdir -p dist/mac/dist
          cp -R config plugins templates patches desktop install scripts dist/mac/
          cp README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md LICENSE dist/mac/
          cp -R docs dist/mac/
          cp -R 'desktop/macos/build/Gildra DSH.app' 'dist/mac/dist/Gildra DSH.app'
          cp 'Install Gildra DSH.command' 'dist/mac/Install Gildra DSH.command'
          cp 'Update Gildra DSH.command' 'dist/mac/Update Gildra DSH.command'
          cd dist/mac && ditto -c -k --sequesterRsrc --keepParent . ../Gildra-DSH-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Gildra-DSH-macOS
          path: dist/Gildra-DSH-macOS.zip

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate and smoke-test installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { node -e 'const m=require("./config/kit.json"); if (process.env.GITHUB_REF_NAME !== `v${m.distribution.version}`) throw new Error("Release tag and kit version differ")' }
          $allErrors = @()
          Get-ChildItem install -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count) { $allErrors += ($errors | ForEach-Object { "$($_.Extent.File): $_" }) }
          }
          if ($allErrors.Count -gt 0) { throw ($allErrors | Out-String) }
          node scripts\kit-config.test.mjs
          $env:GILDRA_DSH_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'gildra-dsh'
          $env:GILDRA_DSH_NO_LAUNCH = '1'
          & .\install\windows-install.ps1
          New-Item -ItemType Directory -Force (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'home\.agent-presets\custom-preserved') | Out-Null
          Set-Content (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'home\user-preservation-check.txt') 'user-setting-preserved'
          Set-Content (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'home\.agent-presets\custom-preserved\preset.yml') 'name: Custom preserved'
          $SettingsHash = (Get-FileHash -Algorithm SHA256 (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'home\settings.yaml')).Hash
          & .\install\windows-install.ps1
          if ((Get-FileHash -Algorithm SHA256 (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'home\settings.yaml')).Hash -ne $SettingsHash) { throw 'settings.yaml was overwritten' }
          if ((Get-Content (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'home\user-preservation-check.txt') -Raw) -notmatch 'user-setting-preserved') { throw 'user data was removed' }
          if ((Get-Content (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'home\.agent-presets\custom-preserved\preset.yml') -Raw) -notmatch 'Custom preserved') { throw 'custom preset was removed' }
          if (-not (Test-Path (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'bin\Update-GildraDSH.ps1'))) { throw 'updater was not installed' }
          if (-not (Test-Path (Join-Path $env:GILDRA_DSH_INSTALL_ROOT '.gildra-kit-version'))) { throw 'kit version marker was not installed' }
          & (Join-Path $env:GILDRA_DSH_INSTALL_ROOT 'bin\dsh-gildra.ps1') --profile web --dump-config | Out-Null
      - name: Assemble archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          Copy-Item config,plugins,templates,patches,install,scripts -Destination dist\windows -Recurse
          Copy-Item README.md,CHANGELOG.md,CONTRIBUTING.md,SECURITY.md,LICENSE -Destination dist\windows
          Copy-Item docs -Destination dist\windows -Recurse
          Copy-Item 'Install Gildra DSH.cmd' 'dist\windows\Install Gildra DSH.cmd'
          Copy-Item 'Update Gildra DSH.cmd' 'dist\windows\Update Gildra DSH.cmd'
          Compress-Archive -Path dist\windows\* -DestinationPath dist\Gildra-DSH-Windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Gildra-DSH-Windows
          path: dist/Gildra-DSH-Windows.zip

  linux-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate server installer
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then node -e 'const m=require("./config/kit.json"); if (process.env.GITHUB_REF_NAME !== `v${m.distribution.version}`) throw new Error("Release tag and kit version differ")'; fi
          chmod +x install/*.sh install/dsh-gildra-server scripts/*.mjs
          bash -n install/linux-server-install.sh install/dsh-gildra-server install/Start-GildraDSH.server.sh
          node scripts/kit-config.test.mjs
      - name: Assemble archive
        run: |
          mkdir -p dist/linux-server
          cp -R config plugins templates patches install scripts dist/linux-server/
          cp README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md LICENSE dist/linux-server/
          cp -R docs dist/linux-server/
          tar -C dist/linux-server -czf dist/Gildra-DSH-Linux-Server.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Gildra-DSH-Linux-Server
          path: dist/Gildra-DSH-Linux-Server.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release checksums
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.zip \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
